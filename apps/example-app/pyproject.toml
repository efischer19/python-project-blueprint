[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example-app"
version = "0.1.0"
description = "Example application demonstrating the monorepo app pattern"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "{{GITHUB_OWNER}}"}
]
dependencies = [
    "click>=8.4",
    "example-lib @ file://../../libs/example-lib"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[project.scripts]
example-app = "app.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
