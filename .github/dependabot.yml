version: 2
updates:
  # Monitor GitHub Actions for version updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Monitor uv dependencies for the whole workspace (apps/* and libs/*).
  # The uv ecosystem updates each member's pyproject.toml together with the
  # shared root uv.lock, keeping the lock file in sync.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
